[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "creativeblocks"
version = "0.0.1"
description = "Making a physical audio workstation."
authors = [
  { name = "Cole Bennett, Tristan Kanitz" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.12.10"


[tool.ruff]
line-length = 99
src = ["creativeblocks"]
include = ["pyproject.toml", "creativeblocks/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["creativeblocks"]
force-sort-within-sections = true

